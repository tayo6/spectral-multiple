name: Build Windows x64 VST3

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure JUCE plug-in and tests
        run: cmake -S juce-plugin -B juce-plugin/build -G "Visual Studio 17 2022" -A x64 -DBUILD_UI_SNAPSHOT=ON

      - name: Build VST3
        run: cmake --build juce-plugin/build --config Release --target WaveLens_VST3 --parallel

      - name: Build Tests
        run: cmake --build juce-plugin/build --config Release --target SpectralMultipleEngineTests WaveLensProcessorTests --parallel

      - name: Run CTest
        run: ctest --test-dir juce-plugin/build -C Release --output-on-failure

      - name: Build UI snapshot renderer
        run: cmake --build juce-plugin/build --config Release --target UiSnapshot --parallel

      - name: Render responsive UI snapshots
        shell: pwsh
        run: |
          $snapshotExe = Get-ChildItem -Path "juce-plugin/build" -Filter "UiSnapshot.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $snapshotExe) { throw "UiSnapshot.exe was not produced by the build." }
          & $snapshotExe "ui-snapshot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: WaveLens-UI-Snapshots
          path: ui-snapshot/*.png
          if-no-files-found: error

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectral-Multiple-Windows-x64-VST3
          path: juce-plugin/build/WaveLens_artefacts/Release/VST3/WaveLens.vst3
          if-no-files-found: error
